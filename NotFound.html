<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            width: 100%;
        }

        .content {
            text-align: center;
            background: transparent;
            padding: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1e293b;
            line-height: 1.2;
        }

        @media (min-width: 640px) {
            h1 {
                font-size: 5rem;
            }
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 6rem;
            }
        }

        p {
            font-size: 1.25rem;
            color: #64748b;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        @media (min-width: 640px) {
            p {
                font-size: 1.5rem;
            }
        }

        .home-link {
            color: #3b82f6;
            text-decoration: underline;
            font-size: 1rem;
            transition: color 0.2s;
            display: inline-block;
        }

        .home-link:hover {
            color: #2563eb;
        }

        @media (min-width: 640px) {
            .home-link {
                font-size: 1.125rem;
            }
        }

        /* Style exact comme dans le composant TSX */
        .text-muted-foreground {
            color: #64748b;
        }

        .text-primary {
            color: #3b82f6;
        }

        .hover\:text-primary\/90:hover {
            color: rgba(59, 130, 246, 0.9);
        }

        .underline {
            text-decoration: underline;
        }

        .font-bold {
            font-weight: 700;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .text-center {
            text-align: center;
        }

        .text-4xl {
            font-size: 2.25rem;
        }

        .text-xl {
            font-size: 1.25rem;
        }

        /* Animation pour le message d'erreur console (optionnel) */
        .console-error {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: #0f172a;
            color: #f87171;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.75rem;
            opacity: 0.5;
            pointer-events: none;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="text-4xl font-bold mb-4">404</h1>
            <p class="text-xl text-muted-foreground mb-4">Oops! Page not found</p>
            <a href="/" class="text-primary underline hover:text-primary/90">
                Return to Home
            </a>
        </div>
    </div>

    <!-- Simulation du console.error (optionnel - pour correspondre au comportement React) -->
    <div class="console-error" id="console-error">
        404 Error: User attempted to access non-existent route: <span id="current-path"></span>
    </div>

    <script>
        // Simulation du useEffect qui log dans la console
        function log404Error() {
            const path = window.location.pathname;
            console.error("404 Error: User attempted to access non-existent route:", path);
            
            // Mettre à jour l'affichage du chemin (optionnel)
            document.getElementById('current-path').textContent = path;
        }

        // Exécuter au chargement
        log404Error();

        // Optionnel : Mettre à jour si l'URL change (pour les SPA)
        window.addEventListener('popstate', log404Error);
    </script>
</body>
</html>
