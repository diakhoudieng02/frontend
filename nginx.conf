server {
    listen 80;
    server_name www.etooblo.ai etooblo.ai;

    # Redirection HTTP → HTTPS
    return 301 https://$server_name$request_uri;
}

server {
# --- NOUVEAU ---
    listen 443 ssl;
    http2 on;

    server_name www.etooblo.ai etooblo.ai;

    # --- 1. Compression Gzip (Crucial pour réduire tes 3.1 Mo de JS) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    ssl_certificate /opt/certs/etooblo.ai/etooblo_ai_combined.crt;
    ssl_certificate_key /opt/certs/etooblo.ai/etooblo_ai.key;

    # --- 2. Sécurité & Best Practices (Pour passer de 96 à 100) ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- 3. Gestion du Cache (Pour régler tes problèmes de chargement) ---
    # Ne JAMAIS cacher l'index.html pour forcer la lecture des nouveaux scripts
    location = /index.html {
        proxy_pass http://docusage_frontend:80;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cacher agressivement les assets (Vite met des hash dans les noms, donc c'est safe)
    location /assets/ {
        proxy_pass http://docusage_frontend:80;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://docusage_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 4. Optimisation Upload (Pour tes 15 Mo de cours) ---
    location /api/ {
        client_max_body_size 20M; # Permet d'envoyer jusqu'à 20Mo
        proxy_pass http://docusage_backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
}