<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ✅ Cache Busting : index.html jamais mis en cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>ETOOBLO AI - Assistant de révision intelligent</title>
    <meta name="description" content="ETOOBLO AI - Ton assistant de révision intelligent pour le lycée. Analyse tes cours, pose des questions et génère des exercices personnalisés." />
    <meta name="author" content="ETOOBLO" />

    <!-- ✅ Meta tags Open Graph mis à jour -->
    <meta property="og:title" content="ETOOBLO AI - Assistant de révision intelligent" />
    <meta property="og:description" content="Ton assistant de révision intelligent pour le lycée. Analyse tes cours, pose des questions et génère des exercices personnalisés." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://etooblo-ia.com" />
    <meta property="og:image" content="https://etooblo-ia.com/og-image.png" />
    <meta property="og:site_name" content="ETOOBLO AI" />

    <!-- ✅ Twitter Cards mis à jour -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ETOOBLOAI" />
    <meta name="twitter:title" content="ETOOBLO AI - Assistant de révision intelligent" />
    <meta name="twitter:description" content="Ton assistant de révision intelligent pour le lycée. Analyse tes cours, pose des questions et génère des exercices personnalisés." />
    <meta name="twitter:image" content="https://ETOOBLO-ia.com/twitter-image.png" />
    <meta name="twitter:creator" content="@ETOOBLOAI" />

    <!-- ✅ Favicon et manifeste -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />

    <!-- ✅ Version de l'application (pour le cache busting) -->
    <meta name="app-version" content="1.0.0" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      ✅ Service Worker avec détection de mise à jour
      Le SW est enregistré après le chargement de la page.
      useAppVersion() dans App.tsx le désenregistre si une nouvelle
      version est détectée, puis force un reload propre.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('✅ Service Worker enregistré');
            
            // Vérifie une mise à jour du SW toutes les 60 secondes
            setInterval(() => {
              registration.update();
              console.log('🔍 Vérification mise à jour SW...');
            }, 60 * 1000);
            
          }).catch((error) => {
            console.error('❌ Erreur enregistrement Service Worker:', error);
          });
        });
      }
    </script>
  </body>
</html>
